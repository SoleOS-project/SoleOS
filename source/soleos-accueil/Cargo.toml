[package]
name = "soleos-accueil"
version = "0.1.0"
edition = "2024"
authors = ["Giuseppe D'Arco (GDH)"]
license = "LicenseRef-SoleOS"
description = "SoleOS : accueil, applications, installateur et outils"

[dependencies]
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_8"] }
gtk4-layer-shell = "0.8.1"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
